<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>大同的技术分享</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 初始加载层：React bundle 下载执行前即显示，资源加载完成后由 StartSpace 移除。
         与备案同层（HTML 解析即渲染），确保白屏阶段有反馈 -->
    <div id="initial-loading" aria-live="polite">
      <div class="initial-loading-title">大同的技术分享</div>
      <div class="initial-loading-text">加载中<span class="initial-loading-dots"></span></div>
    </div>
    <!-- 备案号：站点级全局悬挂，所有 space 共享。主题字下沉到 StartSpace 内按需渲染 -->
    <footer class="site-beian">
      <a
        href="https://beian.miit.gov.cn/"
        target="_blank"
        rel="noopener noreferrer"
        >京ICP备2026056959号-1</a
      >
      <a
        href="https://beian.mps.gov.cn/#/query/webSearch?code=11010502062826"
        target="_blank"
        rel="noopener noreferrer"
        >京公网安备11010502062826号</a
      >
    </footer>
    <script type="module" src="/src/main.tsx"></script>
    <!-- 版本检测：拉取最新 index.html，比对 JS hash，不一致则强制刷新（解决移动端缓存顽固问题） -->
    <script>
      (function () {
        try {
          var currentScript = document.querySelector('script[type="module"]').src;
          fetch('/?v=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var match = html.match(/src="([^"]*index-[^"]+\.js)"/);
              if (match && currentScript.indexOf(match[1]) === -1) {
                location.reload();
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
  </body>
</html>
